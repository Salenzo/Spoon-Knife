<!DOCTYPE html>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<pre id=aa></pre>
<pre id=bb></pre>
<script type=module>
try {
const a=new DecompressionStream('deflate')
const r=a.readable.getReader()
const w=a.writable.getWriter()
w.write(new Uint8Array([0x78,0x9c,3]))
w.close()
await r.read()
} catch (e) {
console.error(e)
aa.textContent=String(e)+'\n\n'+e.stack
}
